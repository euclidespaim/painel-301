# =====================================================================
# Integração contínua do Painel 301
#
# Este arquivo faz o GitHub conferir sozinho cada pull request.
# É o mesmo conceito de CI/CD que vimos na aula 7.
# =====================================================================
name: Verificação

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  conferir:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código do pull request
        uses: actions/checkout@v4
        with:
          # Histórico completo. Com o clone raso padrão, o git não encontra o
          # ancestral comum entre a branch e a main, e a comparação abaixo
          # falha com "no merge base".
          fetch-depth: 0

      - name: Conferir se o JavaScript não tem erro de sintaxe
        run: |
          erros=0
          for arquivo in js/app.js features/equipe-*/feature.js; do
            if node --check "$arquivo" 2>/dev/null; then
              echo "ok      $arquivo"
            else
              echo "ERRO    $arquivo"
              node --check "$arquivo" || true
              erros=1
            fi
          done
          exit $erros

      - name: Conferir se os arquivos da base não foram alterados
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin ${{ github.base_ref }}
          alterados=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)
          echo "Arquivos alterados neste pull request:"
          echo "$alterados"

          alteracoes_index=$(git diff --unified=0 origin/${{ github.base_ref }}...HEAD -- index.html | grep -E '^[+-]' | grep -vE '^(---|\+\+\+)' || true)
          if [ -n "$alteracoes_index" ]; then
            alteracoes_index_invalidas=$(printf '%s\n' "$alteracoes_index" | grep -vE '^\+[[:space:]]*(<link rel="stylesheet" href="features/equipe-[0-9]{2}/style\.css">|<script src="features/equipe-[0-9]{2}/feature\.js"></script>)[[:space:]]*$|^\+[[:space:]]*$' || true)
            if [ -n "$alteracoes_index_invalidas" ]; then
              echo ""
              echo "index.html só pode receber referências aos arquivos da equipe:"
              echo "$alteracoes_index_invalidas"
              exit 1
            fi

            referencias=$(printf '%s\n' "$alteracoes_index" | grep -oE 'features/equipe-[0-9]{2}/(style\.css|feature\.js)' | sort -u || true)
            while IFS= read -r referencia; do
              if [ -n "$referencia" ] && [ ! -f "$referencia" ]; then
                echo "Arquivo referenciado não encontrado: $referencia"
                exit 1
              fi
            done <<< "$referencias"
          fi

          proibidos=$(echo "$alterados" | grep -E '^(js/app\.js|css/base\.css)$' || true)
          if [ -n "$proibidos" ]; then
            echo ""
            echo "Este pull request altera arquivos da base do projeto:"
            echo "$proibidos"
            echo "Cada equipe deve mexer apenas na sua pasta features/equipe-NN/ e registrar seus arquivos no index.html."
            exit 1
          fi
          echo "Nenhum arquivo protegido da base foi alterado."
